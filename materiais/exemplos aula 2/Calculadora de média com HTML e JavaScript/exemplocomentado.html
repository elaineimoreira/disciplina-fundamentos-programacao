<!-- Informa ao navegador que este documento utiliza HTML5 -->
<!DOCTYPE html>

<!-- Tag raiz da página HTML.
     lang="pt-BR" indica que o conteúdo está em português do Brasil -->
<html lang="pt-BR">

<head>

  <!-- Define a codificação UTF-8.
       Permite exibir corretamente caracteres especiais,
       como acentos, cedilhas e símbolos. -->
  <meta charset="UTF-8">

  <!-- Título exibido na aba do navegador -->
  <title>Calculadora de Média</title>

</head>

<body>

  <!-- Título principal da página -->
  <h1>Calculadora de Média</h1>

  <!-- Texto que identifica o campo Nota 1 -->
  <label>Nota 1:</label>

  <!-- Campo de entrada de dados.
       type="number" permite apenas números.
       id="nota1" serve para localizar este campo via JavaScript. -->
  <input type="number" id="nota1">

  <!-- Texto que identifica o campo Nota 2 -->
  <label>Nota 2:</label>

  <!-- Campo de entrada para a segunda nota -->
  <input type="number" id="nota2">

  <!-- Botão que executa a função calcularMedia()
       quando for clicado pelo usuário -->
  <button onclick="calcularMedia()">Calcular</button>

  <!-- Parágrafo inicialmente vazio.
       Será utilizado para exibir o resultado da média. -->
  <p id="resultado"></p>

  <!-- Início do código JavaScript -->
  <script>

    /*
      Criação da função calcularMedia().
      Esta função será executada quando o usuário
      clicar no botão "Calcular".
    */
    function calcularMedia() {

      /*
        Localiza o campo com id="nota1"
        e obtém o valor digitado pelo usuário.

        document = representa toda a página HTML
        getElementById() = procura um elemento pelo id
        value = obtém o conteúdo digitado

        Number() converte o valor recebido (texto)
        para número.
      */
      let nota1 = Number(document.getElementById("nota1").value);

      /*
        Faz exatamente o mesmo processo
        para o campo da segunda nota.
      */
      let nota2 = Number(document.getElementById("nota2").value);

      /*
        Calcula a média aritmética.

        Primeiro soma as duas notas.
        Depois divide o resultado por 2.
      */
      let media = (nota1 + nota2) / 2;

      /*
        Localiza o elemento <p id="resultado">

        innerText altera o texto exibido dentro
        do parágrafo.

        Exemplo:
        "A média é: 8.5"
      */
      document.getElementById("resultado").innerText =
        "A média é: " + media;
    }

  </script>
  <!-- Fim do JavaScript -->

</body>

</html>
